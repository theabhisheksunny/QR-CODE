spring:
  application:
    name: qr-share
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qrshare}
    username: ${DATABASE_USERNAME:qrshare}
    password: ${DATABASE_PASSWORD:qrshare}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:25}MB
      max-request-size: ${MAX_FILE_SIZE_MB:25}MB
  flyway:
    enabled: true

server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  storage:
    path: ${FILE_STORAGE_PATH:./temp-files}
  default-expiration-minutes: ${DEFAULT_EXPIRATION_MINUTES:30}
  max-file-size-mb: ${MAX_FILE_SIZE_MB:25}
  cleanup-interval-ms: ${CLEANUP_INTERVAL_MS:60000}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
